<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Bilibili Trackpad Volume</title>
  <desc id="desc">An upward two-finger swipe raises the native player's volume.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1628"/><stop offset="1" stop-color="#17243d"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#72e5cf"/><stop offset="1" stop-color="#65bfff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c0d6ef" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="24" fill="url(#grid)"/>
  <circle cx="1140" cy="12" r="240" fill="#68bfff" opacity=".05"/>
  <circle cx="650" cy="450" r="220" fill="#72e5cf" opacity=".035"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="62" y="82" fill="#72e5cf" font-size="15" font-weight="700" letter-spacing="3">BILIBILI TRACKPAD VOLUME</text>
    <text x="58" y="159" fill="#f3f7fe" font-size="54" font-weight="800" letter-spacing="-2">UP FEELS RIGHT.</text>
    <text x="62" y="207" fill="#bdcbe0" font-size="22">Two fingers up. Player volume up.</text>
    <text x="62" y="242" fill="#8da1bd" font-size="17">Keep natural scrolling. Keep the native player.</text>
    <g fill="#152c3c" stroke="#315265">
      <rect x="62" y="289" width="118" height="34" rx="17"/>
      <rect x="191" y="289" width="135" height="34" rx="17"/>
      <rect x="337" y="289" width="142" height="34" rx="17"/>
    </g>
    <g fill="#bddcd9" font-size="13" font-weight="600" text-anchor="middle">
      <text x="121" y="311">Local script</text>
      <text x="258.5" y="311">Native volume</text>
      <text x="408" y="311">No calibration</text>
    </g>
    <rect x="645" y="54" width="493" height="282" rx="22" fill="#0a1424" stroke="#31435c"/>
    <circle cx="672" cy="79" r="4" fill="#ff83a7"/>
    <circle cx="687" cy="79" r="4" fill="#f5c784"/>
    <circle cx="702" cy="79" r="4" fill="#72e5cf"/>
    <text x="1110" y="84" fill="#8da1bd" font-size="11" text-anchor="end" letter-spacing="1.4">FULLSCREEN VIDEO</text>
    <path d="M645 100H1138" stroke="#24364f"/>
    <rect x="685" y="130" width="154" height="144" rx="19" fill="#172a41" stroke="#34516c"/>
    <path d="M733 236V187M756 236V187" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>
    <path d="M774 225V158M759 174L774 158L789 174" fill="none" stroke="#72e5cf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="762" y="304" fill="#a2b4cd" font-size="12" text-anchor="middle" letter-spacing="1.5">SWIPE UP</text>
    <path d="M862 198H889M880 189L889 198L880 207" fill="none" stroke="#5b7491" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M919 188H931L946 175V222L931 209H919Z" fill="#c1d8ef"/>
    <path d="M956 187Q968 199 956 211" fill="none" stroke="#c1d8ef" stroke-width="4" stroke-linecap="round"/>
    <g fill="url(#accent)">
      <rect x="982" y="210" width="15" height="21" rx="4"/>
      <rect x="1005" y="194" width="15" height="37" rx="4"/>
      <rect x="1028" y="178" width="15" height="53" rx="4"/>
      <rect x="1051" y="158" width="15" height="73" rx="4"/>
    </g>
    <text x="998" y="304" fill="#72e5cf" font-size="12" text-anchor="middle" letter-spacing="1.5">VOLUME UP</text>
  </g>
</svg>
